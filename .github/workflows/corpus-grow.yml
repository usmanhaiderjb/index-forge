name: 24/7 Continuous Corpus & Market Growth

on:
  schedule:
    # Backup heartbeat: triggers every 4 hours automatically
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      country:
        description: "Target Store Country (e.g. us, gb, de, jp)"
        required: false
        default: "us"
      run_duration:
        description: "Max run duration (e.g. 5h, 300m)"
        required: false
        default: "300m"

permissions:
  actions: write
  contents: read

concurrency:
  group: corpus-growth
  cancel-in-progress: false

jobs:
  grow:
    name: Continuous 24/7 Corpus Growth
    runs-on: ubuntu-latest
    timeout-minutes: 360

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify Database Secret
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error ::DATABASE_URL secret is missing! Please go to Settings -> Secrets and variables -> Actions -> New repository secret and add DATABASE_URL."
            exit 1
          fi

      - name: Run Corpus Growth (Continuous 5-Hour Block)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL || 'redis://localhost:6379' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'bbec8f51447d0897e41bac21a1374aa65d04594fec0560f88493579f2ae402b0' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'fudhPTiOp+40WC77S1VBBBorV+MoTAzYdc2169gh94s=' }}
          ASO_PROVIDER: builtin
          ASO_USER_AGENT: ASO-Dashboard/0.1
          ASO_SCRAPE_DELAY_MS: "1200"
          ASO_SEARCH_DELAY_MS: "4000"
          NODE_ENV: production
          PRISMA_LOG_QUERIES: "0"
        run: |
          COUNTRY="${{ github.event.inputs.country || 'us' }}"
          DURATION="${{ github.event.inputs.run_duration || '300m' }}"
          echo "=========================================================="
          echo "🚀 Starting 24/7 Corpus Growth for country: $COUNTRY"
          echo "⏱ Running continuous block for: $DURATION"
          echo "=========================================================="
          timeout $DURATION npx tsx --require ./scripts/allow-server-modules.cjs --env-file-if-exists=.env scripts/grow.ts --country=$COUNTRY || true
          echo "5-hour crawling block completed."

      - name: Loop & Auto-Trigger Next 24/7 Cycle
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Automatically launching next 24/7 continuous cycle..."
          gh workflow run corpus-grow.yml || true
