# Single-host production stack. One image, three processes.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# For anything beyond one host, use this as the reference for what each process
# needs rather than as the deployment itself. See docs/DEPLOYMENT.md.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aso}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host: only the app containers need to reach it.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aso} -d ${POSTGRES_DB:-aso}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Runs migrations once, then exits. Both long-lived services wait for it, so
  # no process ever serves traffic against a schema it was not built for.
  migrate:
    # The only service that builds. All three run the same image with different
    # commands, so giving each its own `build:` made Compose export three
    # identically-layered images, tripling the export time and — on a full disk —
    # racing three concurrent unpacks of the same layer into an I/O error.
    image: aso:latest
    build:
      context: .
      args:
        # Baked into the canonical and og:image URLs of every prerendered page.
        # Must match the public address, or the marketing site advertises
        # localhost to search engines.
        APP_URL: ${APP_URL:?set APP_URL}
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: [.env.production]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: aso:latest
    restart: unless-stopped
    command: ["node", "server.js"]
    env_file: [.env.production]
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # /api/health returns 503 when Postgres or Redis is unreachable, so this
      # reflects real readiness rather than just "the process is up".
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    image: aso:latest
    restart: unless-stopped
    command:
      ["node_modules/.bin/tsx", "--require", "./scripts/allow-server-modules.cjs", "src/worker/index.ts"]
    env_file: [.env.production]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Nothing syncs without this process. Scale it independently of web:
    #   docker compose -f docker-compose.prod.yml up -d --scale worker=3
    # BullMQ distributes jobs across every worker on the same queue.

volumes:
  pgdata:
  redisdata:
