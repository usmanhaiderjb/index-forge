appId: com.indexforge.desktop
productName: IndexForge
copyright: Copyright © IndexForge

directories:
  output: release
  buildResources: build

# Without this the scoped package name leaks into the filenames and the
# installer ships as "@asodesktop-0.1.0-x64.exe".
artifactName: ${productName}-${version}-${arch}.${ext}

# This app has no runtime dependencies — nothing from node_modules is bundled.
# Left on, electron-builder walks up to the workspace root, finds the web app's
# native modules (msgpackr-extract, sharp) and tries to rebuild them against
# Electron's headers, which needs a C++ toolchain this build does not have and
# does not need.
npmRebuild: false

# Only the compiled main process, the local settings page and the icon. The
# dashboard itself is served by the ASO web app, so none of it is bundled here.
files:
  - dist/**/*
  - renderer/**/*
  - build/icon.png
  - package.json

# `aso://apps/123` opens that route in the running app.
protocols:
  - name: IndexForge
    schemes:
      - indexforge

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: IndexForge

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.developer-tools
  # Required from macOS 10.15 on. Without the hardened runtime the app cannot be
  # notarized, and an un-notarized app is refused on first launch with a message
  # that says the app is damaged rather than that it is unsigned.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
